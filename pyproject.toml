[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imts-benchmark"
version = "0.1.0"
description = "Auditable Pyrregular multivariate classification experiments"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scikit-learn", "PyYAML"]

[project.scripts]
imts = "imts_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
